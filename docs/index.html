<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расписание</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #14171a);
    --hint: var(--tg-theme-hint-color, #6b7280);
    --card: var(--tg-theme-secondary-bg-color, #f1f3f6);
    --accent: var(--tg-theme-button-color, #2f6fed);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --line: rgba(127, 127, 127, .22);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: var(--tg-theme-bg-color, #15181d);
      --text: var(--tg-theme-text-color, #e9ecf1);
      --hint: var(--tg-theme-hint-color, #8b93a1);
      --card: var(--tg-theme-secondary-bg-color, #1f242b);
      --accent: var(--tg-theme-button-color, #5b9bff);
      --accent-text: var(--tg-theme-button-text-color, #0d1117);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }

  /* ---------- Шапка ---------- */
  .top {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
    border-bottom: 1px solid var(--line);
  }
  .group-btn {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    width: 100%; padding: 11px 14px;
    background: var(--card); border: 0; border-radius: var(--radius);
    font-size: 18px; font-weight: 650; text-align: left; cursor: pointer;
  }
  .group-btn .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .group-btn .chev { flex: none; color: var(--hint); font-size: 14px; }
  .group-btn:focus-visible, .seg button:focus-visible, .g-item:focus-visible, #search:focus-visible,
  .retry:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .seg { display: flex; gap: 6px; margin-top: 10px; }
  .seg button {
    flex: 1; padding: 8px 6px; border: 0; border-radius: 10px;
    background: transparent; color: var(--hint); font-size: 15px; font-weight: 550; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }

  /* ---------- Содержимое ---------- */
  main { padding: 12px 14px 8px; max-width: 720px; margin: 0 auto; }
  .notice { margin: 0 0 10px; padding: 10px 12px; border-radius: 10px; background: var(--card); color: var(--hint); font-size: 14px; }

  .day { margin: 0 0 14px; scroll-margin-top: 150px; }
  .day-head { display: flex; align-items: baseline; gap: 8px; padding: 0 2px 6px; }
  .day-name { font-size: 17px; font-weight: 700; }
  .day-date { color: var(--hint); font-size: 14px; }
  .badge { margin-left: auto; padding: 2px 9px; border-radius: 99px; background: var(--accent); color: var(--accent-text); font-size: 12.5px; font-weight: 600; }
  .day.past { opacity: .55; }
  .day.today .day-name { color: var(--accent); }

  .pairs { background: var(--card); border-radius: var(--radius); overflow: hidden; }
  .pair { display: flex; gap: 12px; padding: 11px 12px; }
  .pair + .pair { border-top: 1px solid var(--line); }
  .pnum { flex: none; width: 46px; text-align: center; line-height: 1.15; }
  .pnum b { display: block; font-size: 22px; font-weight: 700; color: var(--accent); }
  .pnum span { display: block; font-size: 12px; color: var(--hint); font-variant-numeric: tabular-nums; }
  .lessons { flex: 1; min-width: 0; }
  .lesson + .lesson { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .subj { font-weight: 600; overflow-wrap: anywhere; }
  .kind { margin-left: 6px; padding: 1px 7px; border-radius: 6px; border: 1px solid var(--line); color: var(--hint); font-size: 12px; font-weight: 500; vertical-align: 1px; white-space: nowrap; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 3px; color: var(--hint); font-size: 14px; }
  .meta .room { color: var(--text); font-weight: 550; }
  .no-pairs { padding: 11px 14px; color: var(--hint); font-size: 14.5px; }

  .state { text-align: center; padding: 48px 20px; color: var(--hint); }
  .state h2 { margin: 0 0 8px; color: var(--text); font-size: 19px; }
  .state p { margin: 0 auto 16px; max-width: 34ch; }
  .retry { padding: 10px 20px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-text); font-weight: 600; cursor: pointer; }

  footer { padding: 4px 14px 22px; text-align: center; color: var(--hint); font-size: 12.5px; }

  /* ---------- Нижняя шторка выбора группы ---------- */
  .overlay { position: fixed; inset: 0; z-index: 10; background: rgba(0, 0, 0, .5); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 11;
    display: flex; flex-direction: column; max-height: 82vh; max-height: 82dvh;
    background: var(--bg); border-radius: 18px 18px 0 0;
    transform: translateY(100%); visibility: hidden;
    transition: transform .26s ease, visibility 0s .26s;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    max-width: 720px; margin: 0 auto;
  }
  .sheet.open { transform: none; visibility: visible; transition: transform .26s ease; }
  .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 8px auto 4px; flex: none; }
  .sheet-title { padding: 6px 16px 8px; font-size: 17px; font-weight: 700; flex: none; }
  #search {
    flex: none; margin: 0 14px 8px; padding: 11px 14px; border: 0; border-radius: 12px;
    background: var(--card); color: var(--text); font: inherit; font-size: 16px; -webkit-appearance: none; appearance: none;
  }
  #search::placeholder { color: var(--hint); }
  #groupList { overflow-y: auto; padding: 0 8px 10px; overscroll-behavior: contain; }
  .g-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    width: 100%; padding: 12px 10px; border: 0; background: transparent; border-radius: 10px;
    text-align: left; font-size: 16.5px; cursor: pointer;
  }
  .g-item:active { background: var(--card); }
  .g-item[aria-current="true"] { background: var(--card); font-weight: 700; color: var(--accent); }
  .g-item .tag { color: var(--hint); font-size: 12.5px; font-weight: 400; }
  .g-empty { padding: 28px 12px; text-align: center; color: var(--hint); }

  @media (prefers-reduced-motion: reduce) {
    .overlay, .sheet, .sheet.open { transition: none; }
  }
</style>
</head>
<body>

<header class="top">
  <button class="group-btn" id="groupBtn" type="button" aria-haspopup="dialog">
    <span class="label" id="groupLabel">Выбрать группу</span>
    <span class="chev" aria-hidden="true">▼</span>
  </button>
  <div class="seg" id="seg" role="group" aria-label="Период">
    <button type="button" data-view="today" aria-pressed="false">Сегодня</button>
    <button type="button" data-view="week" aria-pressed="true">Неделя</button>
    <button type="button" data-view="all" aria-pressed="false">Всё</button>
  </div>
</header>

<main id="content" aria-live="polite"></main>
<footer id="updated"></footer>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Выбор группы">
  <div class="grab"></div>
  <div class="sheet-title">Выберите группу</div>
  <input id="search" type="search" placeholder="Поиск группы" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
  <div id="groupList"></div>
</div>

<script>
(function () {
  'use strict';

  var DATA_URL = 'schedule.json';
  var LS_GROUP = 'schedule.group';
  var LS_VIEW = 'schedule.view';

  var DAY_FULL = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
  var MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];

  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

  var state = { data: null, group: null, view: 'week', error: null, scrolled: false };

  var $content = document.getElementById('content');
  var $label = document.getElementById('groupLabel');
  var $btn = document.getElementById('groupBtn');
  var $seg = document.getElementById('seg');
  var $updated = document.getElementById('updated');
  var $overlay = document.getElementById('overlay');
  var $sheet = document.getElementById('sheet');
  var $search = document.getElementById('search');
  var $list = document.getElementById('groupList');

  /* ---------- localStorage (безопасно) ---------- */
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  /* ---------- Вспомогательное ---------- */
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function toISO(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function fromISO(iso) {
    var p = String(iso).split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }
  function mondayOf(d) {
    var r = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    r.setDate(r.getDate() - ((r.getDay() + 6) % 7));
    return r;
  }
  function addDays(d, n) { var r = new Date(d.getFullYear(), d.getMonth(), d.getDate()); r.setDate(r.getDate() + n); return r; }

  /* ---------- Загрузка данных ---------- */
  function load() {
    state.error = null;
    renderLoading();
    return fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) {
        if (!data || !Array.isArray(data.groups) || !data.schedules || typeof data.schedules !== 'object') {
          var e = new Error('format'); e.code = 'format'; throw e;
        }
        state.data = data;
        var saved = lsGet(LS_GROUP);
        state.group = (saved && data.groups.indexOf(saved) !== -1) ? saved : null;
        var v = lsGet(LS_VIEW);
        if (v === 'today' || v === 'week' || v === 'all') state.view = v;
        render();
        if (!state.group && data.groups.length) openSheet();
      })
      .catch(function (err) {
        state.data = null;
        state.error = err && err.code === 'format' ? 'format' : 'network';
        render();
      });
  }

  /* ---------- Рендер ---------- */
  function renderLoading() {
    $content.textContent = '';
    $content.appendChild(stateBox('Загружаем расписание…', '', null));
  }

  function stateBox(title, text, retry) {
    var box = el('div', 'state');
    box.appendChild(el('h2', null, title));
    if (text) box.appendChild(el('p', null, text));
    if (retry) {
      var b = el('button', 'retry', 'Повторить');
      b.type = 'button';
      b.addEventListener('click', retry);
      box.appendChild(b);
    }
    return box;
  }

  function render() {
    $content.textContent = '';
    $updated.textContent = '';
    updateSeg();

    if (state.error === 'network') {
      $label.textContent = 'Расписание';
      $content.appendChild(stateBox('Не удалось загрузить расписание', 'Проверьте интернет и попробуйте ещё раз.', load));
      return;
    }
    if (state.error === 'format') {
      $label.textContent = 'Расписание';
      $content.appendChild(stateBox('Данные в старом формате',
        'Файл schedule.json ещё не обновился. Запустите GitHub Action «update» вручную или подождите до 30 минут.', load));
      return;
    }
    if (!state.data) return;

    var data = state.data;
    if (!data.groups.length) {
      $label.textContent = 'Расписание';
      $content.appendChild(stateBox('Список групп пуст', 'Скрипт ещё не собрал данные с сайта колледжа. Попробуйте позже.', load));
      return;
    }

    if (data.updated) {
      var u = new Date(data.updated);
      if (!isNaN(u)) $updated.textContent = 'Данные обновлены ' + u.toLocaleString('ru-RU', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
    }

    if (!state.group) {
      $label.textContent = 'Выбрать группу';
      $content.appendChild(stateBox('Группа не выбрана', 'Нажмите на кнопку сверху и выберите свою группу.', openSheet));
      return;
    }

    $label.textContent = state.group;
    var sched = data.schedules[state.group];
    var days = sched && Array.isArray(sched.days) ? sched.days : [];
    if (!days.length) {
      $content.appendChild(stateBox('Для группы ' + state.group + ' нет данных',
        'На сайте колледжа расписание этой группы не найдено или ещё не загружено.', null));
      return;
    }

    renderDays(days);
  }

  function pickDays(days) {
    var todayISO = toISO(new Date());
    var out = { days: [], notice: '', todayISO: todayISO };

    if (state.view === 'all') { out.days = days; return out; }

    if (state.view === 'today') {
      out.days = days.filter(function (d) { return d.iso === todayISO; });
      if (!out.days.length) {
        var first = days[0].iso, last = days[days.length - 1].iso;
        out.notice = 'На сегодня в расписании записей нет. В данных есть период ' + fmtShort(first) + ' — ' + fmtShort(last) + '.';
      }
      return out;
    }

    // week
    var ref = null;
    for (var i = 0; i < days.length; i++) { if (days[i].iso >= todayISO) { ref = days[i]; break; } }
    var isCurrent = true;
    if (!ref) { ref = days[days.length - 1]; isCurrent = false; }
    var mon = mondayOf(fromISO(todayISO));
    var refMon = mondayOf(fromISO(ref.iso));
    if (toISO(refMon) !== toISO(mon)) { mon = refMon; isCurrent = false; }
    var from = toISO(mon), to = toISO(addDays(mon, 6));
    out.days = days.filter(function (d) { return d.iso >= from && d.iso <= to; });
    if (!isCurrent) out.notice = 'Текущей недели в данных нет — показана ближайшая: ' + fmtShort(from) + ' — ' + fmtShort(to) + '.';
    return out;
  }

  function fmtShort(iso) { var d = fromISO(iso); return d.getDate() + ' ' + MONTHS[d.getMonth()]; }

  function renderDays(days) {
    var picked = pickDays(days);
    if (picked.notice) $content.appendChild(el('p', 'notice', picked.notice));
    if (!picked.days.length) return;

    var todayNode = null;
    picked.days.forEach(function (day) {
      var d = fromISO(day.iso);
      var isToday = day.iso === picked.todayISO;
      var isPast = day.iso < picked.todayISO;
      var sec = el('section', 'day' + (isToday ? ' today' : '') + (isPast ? ' past' : ''));

      var head = el('div', 'day-head');
      head.appendChild(el('span', 'day-name', DAY_FULL[d.getDay()]));
      head.appendChild(el('span', 'day-date', d.getDate() + ' ' + MONTHS[d.getMonth()]));
      if (isToday) head.appendChild(el('span', 'badge', 'Сегодня'));
      sec.appendChild(head);

      var box = el('div', 'pairs');
      var pairs = Array.isArray(day.pairs) ? day.pairs : [];
      if (!pairs.length) {
        box.appendChild(el('div', 'no-pairs', 'Занятий нет'));
      } else {
        pairs.forEach(function (p) { box.appendChild(renderPair(p, state.data.bells)); });
      }
      sec.appendChild(box);
      $content.appendChild(sec);
      if (isToday) todayNode = sec;
    });

    if (!state.scrolled && todayNode && state.view === 'all') {
      state.scrolled = true;
      setTimeout(function () { todayNode.scrollIntoView({ block: 'start' }); }, 0);
    }
  }

  function renderPair(p, bells) {
    var row = el('div', 'pair');
    var num = el('div', 'pnum');
    num.appendChild(el('b', null, String(p.n)));
    var time = p.time || (bells && bells[String(p.n)]) || '';
    var parts = String(time).split('-');
    if (parts[0]) num.appendChild(el('span', null, parts[0]));
    if (parts[1]) num.appendChild(el('span', null, parts[1]));
    row.appendChild(num);

    var wrap = el('div', 'lessons');
    (p.lessons || []).forEach(function (ls) {
      var item = el('div', 'lesson');
      var subj = el('div', 'subj', ls.subject || 'Без названия');
      if (ls.kind) subj.appendChild(el('span', 'kind', ls.kind));
      item.appendChild(subj);
      if (ls.room || ls.teacher) {
        var meta = el('div', 'meta');
        if (ls.room) meta.appendChild(el('span', 'room', 'ауд. ' + ls.room));
        if (ls.teacher) meta.appendChild(el('span', null, ls.teacher));
        item.appendChild(meta);
      }
      wrap.appendChild(item);
    });
    row.appendChild(wrap);
    return row;
  }

  function updateSeg() {
    Array.prototype.forEach.call($seg.querySelectorAll('button'), function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-view') === state.view ? 'true' : 'false');
    });
  }

  /* ---------- Шторка выбора группы ---------- */
  function renderGroupList() {
    var q = $search.value.trim().toLowerCase();
    $list.textContent = '';
    var groups = (state.data && state.data.groups) || [];
    var shown = groups.filter(function (g) { return !q || g.toLowerCase().indexOf(q) !== -1; });
    if (!shown.length) {
      $list.appendChild(el('div', 'g-empty', 'Ничего не найдено'));
      return shown;
    }
    shown.forEach(function (g) {
      var b = el('button', 'g-item');
      b.type = 'button';
      b.setAttribute('data-group', g);
      if (g === state.group) b.setAttribute('aria-current', 'true');
      b.appendChild(el('span', null, g));
      var s = state.data.schedules[g];
      if (!s || !s.days || !s.days.length) b.appendChild(el('span', 'tag', 'нет данных'));
      else if (g === state.group) b.appendChild(el('span', 'tag', '✓'));
      $list.appendChild(b);
    });
    return shown;
  }

  function openSheet() {
    if (!state.data || !state.data.groups.length) return;
    $search.value = '';
    renderGroupList();
    $overlay.classList.add('open');
    $sheet.classList.add('open');
    var cur = $list.querySelector('[aria-current="true"]');
    if (cur) setTimeout(function () { cur.scrollIntoView({ block: 'center' }); }, 60);
  }
  function closeSheet() {
    $overlay.classList.remove('open');
    $sheet.classList.remove('open');
    $search.blur();
  }
  function selectGroup(g) {
    state.group = g;
    state.scrolled = false;
    lsSet(LS_GROUP, g);
    closeSheet();
    render();
    window.scrollTo(0, 0);
  }

  $btn.addEventListener('click', openSheet);
  $overlay.addEventListener('click', closeSheet);
  $search.addEventListener('input', renderGroupList);
  $search.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      var items = renderGroupList();
      if (items.length) selectGroup(items[0]);
    }
  });
  $list.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('.g-item') : null;
    if (t) selectGroup(t.getAttribute('data-group'));
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

  $seg.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button[data-view]') : null;
    if (!b) return;
    state.view = b.getAttribute('data-view');
    state.scrolled = false;
    lsSet(LS_VIEW, state.view);
    render();
  });

  load();
})();
</script>
</body>
</html>
